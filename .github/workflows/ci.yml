name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  core-tests:
    name: Build & test (core layers)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test (xUnit, Release)
        run: dotnet test tests/VakilAI.Core.Tests -c Release --nologo -v minimal

  server-worker:
    name: Server worker (syntax + API smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check deployed worker
        run: node --check server/dist/worker.js
      - name: API integration smoke (stubbed D1/gateway)
        run: node server/tools/smoke_worker.mjs

  app-android:
    name: MAUI Android (Debug build)
    runs-on: ubuntu-latest
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 17
      - name: Install MAUI workloads
        run: dotnet workload install android
      - name: Build android head
        run: dotnet build Vakil-AI-IRAN.csproj -f net10.0-android -c Release -p:SkipMauiXamlInflator=false --nologo

  app-windows:
    name: MAUI Windows (Release build)
    runs-on: windows-latest
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install maui-windows workload
        run: dotnet workload install maui-windows
      - name: Build windows head (Release)
        run: dotnet build Vakil-AI-IRAN.csproj -f net10.0-windows10.0.19041.0 -c Release --nologo
