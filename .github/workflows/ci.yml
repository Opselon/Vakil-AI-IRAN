name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  core-tests:
    name: Build & test (core layers)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore (explicit)
        run: dotnet restore tests/VakilAI.Core.Tests --nologo
      - name: Test (xUnit, Release)
        run: dotnet test tests/VakilAI.Core.Tests -c Release --nologo -v minimal

  server-worker:
    name: Server workers (syntax + integrity + API smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24: smoke_marketplace.mjs uses the embedded `node:sqlite`
          # engine (real SQL D1 stub). The legacy smokes run fine on it too.
          node-version: 24
      - name: Syntax-check shipped app artifact
        run: |
          cp server/dist/vakil-app-worker.js /tmp/probe.mjs && node --check /tmp/probe.mjs
      - name: Marketplace part sources syntax
        run: for f in server/tools/parts/app_module_*.js; do node --check "$f"; done
      - name: App worker integrity (128 symbols, unique defs)
        run: node server/tools/check_app_worker.cjs
      - name: Marketplace parts vs shipped artifact (drift check — the rebuild CI cannot do)
        run: node server/tools/check_marketplace_drift.mjs
      - name: API integration smoke — app worker (stubbed D1/gateway)
        run: node server/tools/smoke_app_worker.mjs
      - name: Marketplace dispatcher wiring (built artifact routes)
        run: node server/tools/marketplace_wiring_check.mjs
      - name: Marketplace lifecycle smoke (signup→verify→consult→pay→chat)
        working-directory: server
        run: node tools/smoke_marketplace.mjs
      - name: Marketplace adversarial red-team (tampered tokens, IDOR, races)
        working-directory: server
        run: |
          node tools/marketplace_redteam.mjs || {
            echo "::group::redteam detailed results"
            tail -60 "${RUNNER_TEMP:-/tmp}/vakil_audit/redteam_results.txt" 2>/dev/null || true
            echo "::endgroup::"
            exit 1
          }
      - name: API integration smoke — dual worker (only when the local-only artifact is present)
        if: hashFiles('server/dist/worker.js') != ''
        run: |
          node --check server/dist/worker.js
          node server/tools/smoke_worker.mjs

  live-smoke:
    name: Live smoke (deployed Cloudflare worker)
    runs-on: ubuntu-latest
    needs: server-worker
    timeout-minutes: 10
    env:
      VAKIL_WORKER_URL: https://vakil-app.samerkhaldounmarefi.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Print worker health response
        run: |
          echo "GET $VAKIL_WORKER_URL/api/v1/health"
          curl -sS -w '\nHTTP %{http_code} in %{time_total}s\n' "$VAKIL_WORKER_URL/api/v1/health"
      - name: Provision activation secret file (runner-local, never committed)
        env:
          APP_CHANNEL_CODE: ${{ secrets.APP_CHANNEL_CODE }}
        run: |
          umask 077
          printf 'APP_CHANNEL_CODE=%s\n' "$APP_CHANNEL_CODE" > /tmp/vakil_secrets.txt
          echo "VAKIL_SECRETS=/tmp/vakil_secrets.txt" >> "$GITHUB_ENV"
      - name: LIVE API smoke against the deployed worker
        run: node server/tools/live_smoke.mjs "$VAKIL_WORKER_URL"
      - name: Remove secret file
        if: always()
        run: rm -f /tmp/vakil_secrets.txt

  app-android:
    name: MAUI Android (Debug build)
    runs-on: ubuntu-latest
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 17
      - name: Install MAUI workloads (via global.json SDK)
        run: dotnet workload restore Vakil-AI-IRAN.csproj
      - name: Build android head
        run: dotnet build Vakil-AI-IRAN.csproj -f net10.0-android -c Release -p:SkipMauiXamlInflator=false --nologo

  app-windows:
    name: MAUI Windows (Release build)
    runs-on: windows-latest
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install maui-windows workload
        run: dotnet workload install maui-windows
      - name: Build windows head (Release)
        run: dotnet build Vakil-AI-IRAN.csproj -f net10.0-windows10.0.19041.0 -c Release --nologo
