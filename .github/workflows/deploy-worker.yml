name: Deploy — App Worker (wrangler)

# Manual gate: deploy the committed artifact after integrity + smoke checks.
# Requires repo secrets: CLOUDFLARE_API_TOKEN (Workers Scripts Edit + D1 + KV read),
# CLOUDFLARE_ACCOUNT_ID.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to publish vakil-app to Cloudflare"
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-app-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrity + offline smoke of the shipped artifact
        working-directory: server
        run: |
          node --check dist/vakil-app-worker.js
          node tools/check_app_worker.cjs
          node tools/smoke_app_worker.mjs
      - name: Deploy with wrangler
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler deploy -c wrangler.app.toml
      - name: Post-deploy health probe
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS https://vakil-app.samerkhaldounmarefi.workers.dev/api/v1/health | grep -q '"ok":true'; then
              echo "worker healthy"; exit 0
            fi
            sleep 4
          done
          echo "::error::health probe failed"
          exit 1
